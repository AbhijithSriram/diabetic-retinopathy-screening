<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <radialGradient id="fullGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fullRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9E1B1B"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left: 48x48 centered at x=32, y=32) -->
  <g transform="translate(6, 6)">
    <!-- Ambient Retinal Halo -->
    <circle cx="26" cy="26" r="25" fill="url(#fullGlow)"/>

    <!-- Outer Aperture Ring -->
    <circle cx="26" cy="26" r="21" stroke="url(#fullRingGrad)" stroke-width="3.2" stroke-linecap="round"/>
    
    <!-- Stylized Retinal Wings -->
    <path d="M5 26 C5 14.4 14.4 5 26 5" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="26 6"/>
    <path d="M47 26 C47 37.6 37.6 47 26 47" stroke="#9E1B1B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="26 6"/>

    <!-- Middle Concentric Boundary (Optic Disc Zone) -->
    <circle cx="26" cy="26" r="12.5" stroke="url(#fullRingGrad)" stroke-width="2.4"/>

    <!-- Inner Fovea / Pupil -->
    <circle cx="26" cy="26" r="5.5" fill="#C2410C"/>
    <circle cx="26" cy="26" r="2.2" fill="#FAF6F0"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(68, 0)">
    <!-- Primary Brand Wordmark: DrishtiTrust -->
    <text x="0" y="36" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', serif" font-weight="700" font-size="28" fill="#231B1A" letter-spacing="-0.5px">
      Drishti<tspan font-weight="400" fill="#342725">Trust</tspan>
    </text>

    <!-- Subtitle / Eyebrow: DESIGN SYSTEM / RURAL RETINOPATHY SCREENING -->
    <text x="1" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#C2410C" letter-spacing="3.2px">
      EXPLAINABLE AI SCREENING
    </text>
  </g>
</svg>
