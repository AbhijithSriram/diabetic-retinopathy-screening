<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- DrishtiTrust Retinal Aperture Emblem -->
  <defs>
    <radialGradient id="dtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dtRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9E1B1B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Retinal Halo -->
  <circle cx="24" cy="24" r="22" fill="url(#dtGlow)"/>

  <!-- Outer Aperture / Ocular Ring with Retinal Arch Brackets -->
  <circle cx="24" cy="24" r="19" stroke="url(#dtRingGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Outer Anatomical Horizon Wings -->
  <path d="M5 24 C5 13.5 13.5 5 24 5" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="24 6"/>
  <path d="M43 24 C43 34.5 34.5 43 24 43" stroke="#9E1B1B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="24 6"/>

  <!-- Middle Concentric Boundary (Optic Disc Zone) -->
  <circle cx="24" cy="24" r="11.5" stroke="url(#dtRingGrad)" stroke-width="2.2" stroke-opacity="0.9"/>

  <!-- Inner Fovea / Visual Axis Center -->
  <circle cx="24" cy="24" r="5" fill="#C2410C"/>
  <circle cx="24" cy="24" r="2" fill="#FAF6F0"/>
</svg>
