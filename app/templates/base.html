<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DrishtiTrust{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<!-- Inter & JetBrains Mono Fonts from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand-wrap">
    <img src="/static/drishtitrust-full-logo.svg" alt="DrishtiTrust" class="logo-full">
  </a>
    <a href="/" class="{{ 'on' if active=='home' }}">Home</a>
    <a href="/login" class="{{ 'on' if active=='login' }}">Portal</a>
    <a href="/screen" class="{{ 'on' if active=='screen' }}">Screen</a>
    <a href="/review" class="{{ 'on' if active=='review' }}">Tele-review</a>
    <a href="/referrals" class="{{ 'on' if active=='referrals' }}">Referrals</a>
    <a href="/dashboard" class="{{ 'on' if active=='dashboard' }}">Dashboard</a>
    <a href="/study" class="{{ 'on' if active=='study' }}">Reader study</a>
  </nav>
  <div class="header-status-area">
    <span class="net-pill" id="net-status">Online</span>
    <span class="proto">Research prototype &middot; Not a medical device</span>
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
<script>
// Real-time network connectivity listener
function updateNetPill() {
  const p = document.getElementById('net-status');
  if (!p) return;
  if (navigator.onLine) {
    p.textContent = 'Online';
    p.classList.remove('offline');
  } else {
    p.textContent = 'Offline';
    p.classList.add('offline');
  }
}
window.addEventListener('online', updateNetPill);
window.addEventListener('offline', updateNetPill);
updateNetPill();

// Register Offline ServiceWorker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(err => {
      console.warn('SW registration skipped:', err);
    });
  });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
